<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازی دایناسور دونده گوگل</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            background-color: #fdfa87;
        }
    </style>
</head>
<body>

<canvas id="gameCanvas" width="800" height="200"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');


    const dinoWidth = 40;
    const dinoHeight = 40;
    const gravity = 0.8;
    const jumpStrength = -15;
    let dinoY = canvas.height - dinoHeight;
    let dinoVelocity = 0;
    let isJumping = false;

   
    const cactusWidth = 20;
    const cactusHeight = 40;
    let cactusX = canvas.width;
    const cactusSpeed = 3;

    // امتیاز
    let score = 0;

    // دایناسور
    function drawDino() {
        ctx.fillStyle = 'green';
        ctx.fillRect(50, dinoY, dinoWidth, dinoHeight);
    }

   
    function updateDino() {
        if (isJumping) {
            dinoVelocity += gravity;
            dinoY += dinoVelocity;

            if (dinoY >= canvas.height - dinoHeight) {
                dinoY = canvas.height - dinoHeight;
                isJumping = false;
                dinoVelocity = 0;
            }
        }
    }

  
    function drawCactus() {
        ctx.fillStyle = 'brown';
        ctx.fillRect(cactusX, canvas.height - cactusHeight, cactusWidth, cactusHeight);
        cactusX -= cactusSpeed;

      
        if (cactusX + cactusWidth < 0) {
            cactusX = canvas.width;
            score++;
        }
    }

    
    function checkCollision() {
        if (50 + dinoWidth > cactusX && 50 < cactusX + cactusWidth) {
            if (dinoY + dinoHeight > canvas.height - cactusHeight) {
                resetGame();
            }
        }
    }

    
    function drawScore() {
        ctx.fillStyle = 'black';
        ctx.font = '20px Arial';
        ctx.fillText('امتیاز: ' + score, 10, 30);
    }

    
    function resetGame() {
        dinoY = canvas.height - dinoHeight;
        dinoVelocity = 0;
        isJumping = false;
        cactusX = canvas.width;
        score = 0;
    }

    
    function gameLoop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        updateDino();
        drawDino();

        drawCactus();
        checkCollision();

        drawScore();

        requestAnimationFrame(gameLoop);
    }

   
    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' && !isJumping) {
            isJumping = true;
            dinoVelocity = jumpStrength;
        }
    });

    gameLoop();
</script>

</body>
</html>
